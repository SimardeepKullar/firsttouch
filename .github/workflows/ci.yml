name: CI

# Runs on every pull request, and again on main after a merge.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the older run. Runs on main are never
# cancelled, so a prod deploy is never stopped halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # typecheck + lint + tests: the same command the pre-push hook runs.
      - run: npm run verify

      # A throwaway Supabase inside the CI machine. Starting it runs every
      # migration and seed.sql from scratch, so a broken migration fails here.
      - name: Start local Supabase
        run: npx supabase start

      - name: Lint the database functions
        run: npx supabase db lint --fail-on error

      # pgTAP tests in supabase/tests/database: RLS policies, grants and the
      # guard/security-definer functions do what docs/spec.md says.
      - name: Run the database tests
        run: npx supabase test db

      - name: Check database.types.ts matches the migrations
        run: |
          npx supabase gen types typescript > "$RUNNER_TEMP/database.types.ts"
          if ! diff -u src/lib/database.types.ts "$RUNNER_TEMP/database.types.ts"; then
            echo "::error::src/lib/database.types.ts is out of date. Run: npm run db:types"
            exit 1
          fi

  # Only after verify passes, only on main, and only once the prod project is
  # set up (the SUPABASE_PROD_PROJECT_REF variable exists). This is the one
  # and only path by which a change reaches the prod database.
  deploy-prod:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_PROD_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_REF: ${{ vars.SUPABASE_PROD_PROJECT_REF }}
      PROD_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Prints which migrations are new, into the run log, before applying.
      - name: Preview prod migrations
        run: npx supabase db push --remote="$PROD_REF" --password "$PROD_DB_PASSWORD" --dry-run

      # Applies only migrations prod hasn't run yet. Never resets, never seeds.
      - name: Apply prod migrations
        run: npx supabase db push --remote="$PROD_REF" --password "$PROD_DB_PASSWORD" --yes
