<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FirstTouch · Forgot password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E4D32}a:hover{color:#0A3A26}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EE; font-family: 'Archivo', system-ui, sans-serif; color: #121A15; display: flex; flex-direction: column; padding: 16px 24px 32px; overflow: hidden">
  <a href="SignInEmail.dc.html" style="align-self: flex-start; height: 44px; padding: 0 14px 0 8px; margin-left: -8px; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Back to sign in
  </a>
  <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 40px">
      <div style="width: 56px; height: 56px; border-radius: 18px; background: #DCEBE2; display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E4D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      </div>
      <h1 style="margin: 12px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Forgot your password?</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #56625B">Enter your email and we'll send you a link to set a new one.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 28px">
      <label for="fp-email" style="font-size: 14px; font-weight: 700">Email</label>
      <input id="fp-email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 56px; border-radius: 16px; border: 1.5px solid #D6D5CC; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 17px; color: #121A15; box-sizing: border-box">
    </div>
    <button type="button" onClick="{{ submit }}" style="margin-top: 20px; height: 56px; border-radius: 16px; border: none; background: #0E4D32; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Send reset link</button>
  </sc-if>
  <sc-if value="{{ isSent }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 40px">
      <div style="width: 56px; height: 56px; border-radius: 18px; background: #DCEBE2; display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E4D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M4 7l8 6 8-6"></path></svg>
      </div>
      <h1 style="margin: 12px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Check your email</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #56625B">If that email has an account, we've sent a link.</p>
    </div>
    <a href="SignInEmail.dc.html" style="margin-top: 32px; height: 56px; border-radius: 16px; background: #0E4D32; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Back to sign in</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["form","sent"],"default":"form"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: null };
  }
  renderVals() {
    const step = this.state.step ?? this.props.step ?? 'form';
    return { isForm: step === 'form', isSent: step === 'sent', submit: () => this.setState({ step: 'sent' }) };
  }
}
</script>
</body>
</html>
