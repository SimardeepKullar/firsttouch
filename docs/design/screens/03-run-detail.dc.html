<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FirstTouch · Run detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E4D32}a:hover{color:#0A3A26}
</style>
</helmet>
<div style="width: 390px; height: {{rootH}}; box-sizing: border-box; background: #F4F3EE; color: #121A15; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #0E4D32; color: #FFFFFF; padding: 16px 16px 22px; border-radius: 0 0 28px 28px; display: flex; flex-direction: column; gap: 14px">
    <a href="Home.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; margin-left: -6px; border-radius: 14px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div>
      <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #B9DCC8">Sunday run · Indoor</div>
      <h1 style="margin: 4px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Sunday, Feb 14</h1>
      <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: #DDEDE3">
        <div style="display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>6:30 AM start
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>7855 Finch Ave W, Brampton
        </div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="border-radius: 16px; background: rgba(255,255,255,0.12); padding: 10px 12px">
        <div style="font-size: 24px; font-weight: 800">20</div><div style="font-size: 13px; color: #DDEDE3">going</div>
      </div>
      <div style="border-radius: 16px; background: rgba(255,255,255,0.12); padding: 10px 12px">
        <div style="font-size: 24px; font-weight: 800">10</div><div style="font-size: 13px; color: #DDEDE3">attackers</div>
      </div>
      <div style="border-radius: 16px; background: rgba(255,255,255,0.12); padding: 10px 12px">
        <div style="font-size: 24px; font-weight: 800">10</div><div style="font-size: 13px; color: #DDEDE3">defenders</div>
      </div>
    </div>
  </header>
  <div style="flex-grow: 1; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 14px; min-height: 0">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E1D9">
      <div>
        <div style="font-size: 16px; font-weight: 800">{{rsvpTitle}}</div>
        <div style="font-size: 13px; color: #56625B; display: flex; align-items: center; gap: 6px; margin-top: 2px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>{{closeLine}}
        </div>
      </div>
      <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ true }}">
        <a href="Home.dc.html" style="height: 44px; padding: 0 16px; border-radius: 999px; background: #ECEBE4; color: #121A15; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center">{{changeLabel}}</a>
      </sc-if>
      <sc-if value="{{ isLocked }}" hint-placeholder-val="{{ false }}">
        <button type="button" disabled style="height: 44px; padding: 0 14px; border: none; border-radius: 999px; background: #ECEBE4; color: #6B746E; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: not-allowed">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Locked
        </button>
      </sc-if>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 800">Who's coming</h2>
      <span style="font-size: 14px; color: #56625B; font-weight: 600">{{listNote}}</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 4px 0; border-radius: 22px; background: #FFFFFF; border: 1px solid #E2E1D9; display: flex; flex-direction: column">
      <sc-for list="{{ players }}" as="p" hint-placeholder-count="20">
        <li style="display: flex; align-items: center; gap: 12px; padding: 8px 14px; min-height: 48px; border-top: {{p.divider}}">
          <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #ECEBE4; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.ini}}</span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="font-size: 16px; font-weight: 700">{{p.name}}</div>
            <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
              <sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ false }}">
                <span role="img" aria-label="{{p.starLabel}}" style="display: flex; gap: 1px">
                  <sc-for list="{{ p.stars }}" as="st" hint-placeholder-count="5">
                    <svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="{{st.c}}"></path></svg>
                  </sc-for>
                </span>
              </sc-if>
              <sc-for list="{{ p.flags }}" as="f" hint-placeholder-count="0">
                <span style="height: 20px; padding: 0 7px; border-radius: 999px; background: {{f.bg}}; color: {{f.fg}}; font-size: 11px; font-weight: 800; display: flex; align-items: center">{{f.label}}</span>
              </sc-for>
            </div>
          </div>
          <span style="flex-shrink: 0; width: 42px; height: 26px; border-radius: 8px; box-sizing: border-box; background: {{p.posBg}}; color: {{p.posFg}}; border: 1.5px solid #121A15; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; letter-spacing: 0.04em">{{p.pos}}</span>
        </li>
      </sc-for>
    </ul>
  </div>
  <nav aria-label="Main" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 8px 12px 20px; background: #FFFFFF; border-top: 1px solid #E2E1D9; display: grid; grid-template-columns: {{navCols}}">
    <a href="Home.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0E4D32; font-size: 12px; font-weight: 800">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home
    </a>
    <a href="Teams.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56625B; font-size: 12px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 3 6l2 5 3-1v11h8V10l3 1 2-5-5-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"></path></svg>Teams
    </a>
    <sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ false }}">
      <a href="AdminPlayers.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56625B; font-size: 12px; font-weight: 600">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8.2 8 9 4.6-.8 8-4.5 8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>Admin
      </a>
    </sc-if>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56625B; font-size: 12px; font-weight: 600">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["player","admin"],"default":"player"},"locked":{"editor":"boolean","default":false},"going":{"editor":"boolean","default":true},"$preview":{"width":390,"height":1660}}'>
class Component extends DCLogic {
  renderVals() {
    const isAdmin = this.props.role === 'admin';
    const locked = !!this.props.locked;
    const raw = [
      ['Marco Bellini', 5, 'ATT'], ['Tomás Rivera', 5, 'DEF'], ['Priya Nair', 3, 'DEF'], ['Daniel Mensah', 4, 'DEF'],
      ['Aisha Bello', 4, 'ATT'], ['Hassan Karimi', 5, 'ATT'], ['Kofi Asante', 2, 'ATT', 'U'], ['Elena Petrova', 4, 'DEF'],
      ['Lena Fischer', 3, 'ATT'], ['Jordan Lee', 3, 'DEF', 'U'], ['Sim', 4, 'DEF'], ['Mei Chen', 2, 'ATT'],
      ['Grace Liu', 3, 'DEF', 'U'], ['Chris Novak', 3, 'ATT'], ['Owen Barker', 2, 'DEF'], ['Nadia Haddad', 4, 'ATT'],
      ['Ben Carter', 3, 'ATT'], ['Yusuf Demir', 3, 'DEF'], ['Sam Whitfield', 2, 'DEF', 'M'], ['Diego Ortiz', 4, 'ATT', 'M']
    ];
    const players = raw.map(([name, s, pos, flag], i) => ({
      name,
      ini: name.split(' ').map((w) => w[0]).join(''),
      starLabel: s + ' of 5 stars',
      stars: [1, 2, 3, 4, 5].map((k) => ({ c: k <= s ? '#121A15' : '#D3D3CA' })),
      pos,
      posBg: pos === 'ATT' ? '#121A15' : '#FFFFFF',
      posFg: pos === 'ATT' ? '#FFFFFF' : '#121A15',
      divider: i === 0 ? 'none' : '1px solid #ECEBE4',
      flags: flag === 'M' ? [{ label: 'Morning of', bg: '#FEF3C7', fg: '#92400E' }]
        : (flag === 'U' && isAdmin) ? [{ label: 'Unpaid', bg: '#FEE2E2', fg: '#B91C1C' }] : []
    }));
    return {
      players, isAdmin,
      isOpen: !locked, isLocked: locked,
      rsvpTitle: this.props.going === false ? 'You’re not going' : 'You’re in',
      changeLabel: this.props.going === false ? 'I’m in' : 'Change',
      closeLine: locked ? 'RSVPs closed 5:30 AM' : 'RSVPs close 5:30 AM',
      listNote: isAdmin ? 'In order of RSVP · admin view' : 'In order of RSVP',
      rootH: isAdmin ? '1730px' : '1660px',
      navCols: isAdmin ? 'repeat(4, minmax(0, 1fr))' : 'repeat(3, minmax(0, 1fr))'
    };
  }
}
</script>
</body>
</html>
