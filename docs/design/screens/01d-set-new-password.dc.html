<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FirstTouch V2 · Set a new password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.page}}; font-family: 'Inter', system-ui, sans-serif; color: {{t.ink}}; display: flex; flex-direction: column; padding: 60px 24px 32px; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <img src="/_blob/3dfcf1bac4cf45bac56a39dd2306c225" alt="" width="56" height="56" style="width: 56px; height: 56px; display: block">
    <h1 style="margin: 12px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Set a new password</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.45; color: {{t.muted}}">For <strong style="color: {{t.ink}}">daniel@example.com</strong></p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 28px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="np-new" style="font-size: 14px; font-weight: 700">New password</label>
      <div style="position: relative">
        <input id="np-new" type="{{passType}}" autocomplete="new-password" aria-describedby="np-hint" style="width: 100%; height: 56px; border-radius: 16px; border: 1.5px solid {{t.inputBorder}}; background: {{t.surface}}; padding: 0 56px 0 16px; font-family: inherit; font-size: 17px; color: {{t.ink}}; box-sizing: border-box">
        <button type="button" aria-label="{{eyeLabel}}" onClick="{{ toggleEye }}" style="position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border: none; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><path d="{{slash}}"></path></svg>
        </button>
      </div>
      <span id="np-hint" style="font-size: 13px; color: {{t.muted}}">At least 8 characters</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="np-confirm" style="font-size: 14px; font-weight: 700">Confirm password</label>
      <input id="np-confirm" type="{{passType}}" autocomplete="new-password" style="height: 56px; border-radius: 16px; border: 1.5px solid {{t.inputBorder}}; background: {{t.surface}}; padding: 0 16px; font-family: inherit; font-size: 17px; color: {{t.ink}}; box-sizing: border-box">
    </div>
    <button type="button" style="margin-top: 4px; height: 56px; border-radius: 16px; border: none; background: {{t.btn}}; color: {{t.onBrand}}; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Save password</button>
  </div>
</div>
</x-dc>

      starOn: '#F1F5F2', starOff: '#33443B', shadow: '0 12px 30px rgba(0,0,0,0.35)', watermark: 'rgba(255,255,255,0.05)',

</body>
</html>
