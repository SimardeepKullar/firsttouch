<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FirstTouch · Set a new password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E4D32}a:hover{color:#0A3A26}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EE; font-family: 'Archivo', system-ui, sans-serif; color: #121A15; display: flex; flex-direction: column; padding: 60px 24px 32px; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <img src="/_blob/3dfcf1bac4cf45bac56a39dd2306c225" alt="" width="56" height="56" style="width: 56px; height: 56px; display: block">
    <h1 style="margin: 12px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Set a new password</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #56625B">For <strong style="color: #121A15">daniel@example.com</strong></p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 28px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="np-new" style="font-size: 14px; font-weight: 700">New password</label>
      <div style="position: relative">
        <input id="np-new" type="{{passType}}" autocomplete="new-password" aria-describedby="np-hint" style="width: 100%; height: 56px; border-radius: 16px; border: 1.5px solid #D6D5CC; background: #FFFFFF; padding: 0 56px 0 16px; font-family: inherit; font-size: 17px; color: #121A15; box-sizing: border-box">
        <button type="button" aria-label="{{eyeLabel}}" onClick="{{ toggleEye }}" style="position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border: none; background: transparent; color: #56625B; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><path d="{{slash}}"></path></svg>
        </button>
      </div>
      <span id="np-hint" style="font-size: 13px; color: #56625B">At least 8 characters</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="np-confirm" style="font-size: 14px; font-weight: 700">Confirm password</label>
      <input id="np-confirm" type="{{passType}}" autocomplete="new-password" style="height: 56px; border-radius: 16px; border: 1.5px solid #D6D5CC; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 17px; color: #121A15; box-sizing: border-box">
    </div>
    <button type="button" style="margin-top: 4px; height: 56px; border-radius: 16px; border: none; background: #0E4D32; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Save password</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: false };
  }
  renderVals() {
    return {
      slash: this.state.show ? "" : "M3 3l18 18",
      passType: this.state.show ? 'text' : 'password',
      eyeLabel: this.state.show ? 'Hide passwords' : 'Show passwords',
      toggleEye: () => this.setState({ show: !this.state.show })
    };
  }
}
</script>
</body>
</html>
