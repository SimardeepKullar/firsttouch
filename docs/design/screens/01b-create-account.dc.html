<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FirstTouch · Create account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E4D32}a:hover{color:#0A3A26}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EE; font-family: 'Archivo', system-ui, sans-serif; color: #121A15; display: flex; flex-direction: column; padding: 16px 24px 32px; overflow: hidden">
  <a href="SignInEmail.dc.html" style="align-self: flex-start; height: 44px; padding: 0 14px 0 8px; margin-left: -8px; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Back to sign in
  </a>
  <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px">
      <img src="/_blob/3dfcf1bac4cf45bac56a39dd2306c225" alt="" width="56" height="56" style="width: 56px; height: 56px; display: block">
      <h1 style="margin: 12px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Create your account</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #56625B">Use the name your teammates know you by.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 28px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ca-name" style="font-size: 14px; font-weight: 700">Name</label>
        <input id="ca-name" type="text" autocomplete="name" placeholder="First and last name" style="height: 56px; border-radius: 16px; border: 1.5px solid #D6D5CC; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 17px; color: #121A15; box-sizing: border-box">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ca-email" style="font-size: 14px; font-weight: 700">Email</label>
        <input id="ca-email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 56px; border-radius: 16px; border: 1.5px solid #D6D5CC; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 17px; color: #121A15; box-sizing: border-box">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="ca-pass" style="font-size: 14px; font-weight: 700">Password</label>
        <div style="position: relative">
          <input id="ca-pass" type="{{passType}}" autocomplete="new-password" aria-describedby="ca-hint" style="width: 100%; height: 56px; border-radius: 16px; border: 1.5px solid #D6D5CC; background: #FFFFFF; padding: 0 56px 0 16px; font-family: inherit; font-size: 17px; color: #121A15; box-sizing: border-box">
          <button type="button" aria-label="{{eyeLabel}}" onClick="{{ toggleEye }}" style="position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border: none; background: transparent; color: #56625B; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><path d="{{slash}}"></path></svg>
          </button>
        </div>
        <span id="ca-hint" style="font-size: 13px; color: #56625B">At least 8 characters</span>
      </div>
      <button type="button" onClick="{{ submit }}" style="margin-top: 4px; height: 56px; border-radius: 16px; border: none; background: #0E4D32; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Create account</button>
    </div>
    <p style="margin: auto 0 0; font-size: 15px; color: #56625B; text-align: center">Already have an account? <a href="SignInEmail.dc.html" style="font-weight: 700; text-decoration: none">Sign in</a></p>
  </sc-if>
  <sc-if value="{{ isSent }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 56px">
      <div style="width: 56px; height: 56px; border-radius: 18px; background: #DCEBE2; display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E4D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M4 7l8 6 8-6"></path></svg>
      </div>
      <h1 style="margin: 12px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15">Check your email to confirm your account</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #56625B">We sent a confirmation link to <strong style="color: #121A15">daniel@example.com</strong>. Open it to finish creating your account.</p>
    </div>
    <button type="button" style="margin-top: 32px; height: 56px; border-radius: 16px; border: 1.5px solid #D6D5CC; background: #FFFFFF; color: #121A15; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Resend email</button>
    <a href="SignInEmail.dc.html" style="margin-top: 12px; height: 56px; border-radius: 16px; background: #0E4D32; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Back to sign in</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["form","sent"],"default":"form"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: null, show: false };
  }
  renderVals() {
    const step = this.state.step ?? this.props.step ?? 'form';
    return {
      isForm: step === 'form', isSent: step === 'sent',
      submit: () => this.setState({ step: 'sent' }),
      slash: this.state.show ? "" : "M3 3l18 18",
      passType: this.state.show ? 'text' : 'password',
      eyeLabel: this.state.show ? 'Hide password' : 'Show password',
      toggleEye: () => this.setState({ show: !this.state.show })
    };
  }
}
</script>
</body>
</html>
