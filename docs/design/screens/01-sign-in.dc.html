<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FirstTouch V2 · Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.page}}; font-family: 'Inter', system-ui, sans-serif; color: {{t.ink}}; display: flex; flex-direction: column; padding: {{pad}}; overflow: hidden">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">

    <h1 style="margin: 6px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">First<span style="color: {{t.brandText}}">Touch</span></h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.45; color: {{t.muted}}; text-align: center; max-width: 280px">Weekend morning soccer. Sign in to RSVP and see your team.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px; margin-top: {{gapTop}}">
    <button type="button" style="height: 56px; border-radius: 16px; border: 1.5px solid {{t.inputBorder}}; background: {{t.surface}}; font-family: inherit; font-size: 17px; font-weight: 600; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer">
      <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid {{t.inputBorder}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: {{t.muted}}">G</span>
      Continue with Google
    </button>
    <sc-if value="{{ emailOn }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 12px; color: {{t.muted}}; font-size: 14px; font-weight: 600">
        <div style="flex-grow: 1; height: 1px; background: {{t.inputBorder}}"></div>or<div style="flex-grow: 1; height: 1px; background: {{t.inputBorder}}"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="si-email" style="font-size: 14px; font-weight: 700">Email</label>
        <input id="si-email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 56px; border-radius: 16px; border: 1.5px solid {{t.inputBorder}}; background: {{t.surface}}; padding: 0 16px; font-family: inherit; font-size: 17px; color: {{t.ink}}; box-sizing: border-box">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <label for="si-pass" style="font-size: 14px; font-weight: 700">Password</label>
          <a href="V2ForgotPassword.dc.html" style="color: {{t.brandText}}; font-size: 14px; font-weight: 700; text-decoration: none; min-height: 24px">Forgot password?</a>
        </div>
        <div style="position: relative">
          <input id="si-pass" type="{{passType}}" autocomplete="current-password" value="footy2027" style="width: 100%; height: 56px; border-radius: 16px; border: 1.5px solid {{t.inputBorder}}; background: {{t.surface}}; padding: 0 56px 0 16px; font-family: inherit; font-size: 17px; color: {{t.ink}}; box-sizing: border-box">
          <button type="button" aria-label="{{eyeLabel}}" onClick="{{ toggleEye }}" style="position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border: none; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><path d="{{slash}}"></path></svg>
          </button>
        </div>
      </div>
      <button type="button" style="height: 56px; border-radius: 16px; border: none; background: {{t.btn}}; color: {{t.onBrand}}; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Sign in</button>
    </sc-if>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <sc-if value="{{ emailOn }}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; font-size: 15px; color: {{t.muted}}">New here? <a href="V2CreateAccount.dc.html" style="color: {{t.brandText}}; font-weight: 700; text-decoration: none">Create an account</a></p>
    </sc-if>
    <p style="margin: 0; font-size: 13px; color: {{t.muted}}; text-align: center; line-height: 1.5">By continuing you agree to our <a href="#">Privacy policy</a>.</p>
  </div>
</div>
</x-dc>

</body>
</html>
