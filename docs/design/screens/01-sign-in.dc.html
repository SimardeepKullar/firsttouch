<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FirstTouch · Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E4D32}a:hover{color:#0A3A26}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EE; font-family: 'Archivo', system-ui, sans-serif; color: #121A15; display: flex; flex-direction: column; padding: {{pad}}; overflow: hidden">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
    <img src="/_blob/3dfcf1bac4cf45bac56a39dd2306c225" alt="FirstTouch logo" width="96" height="96" style="width: {{logo}}; height: {{logo}}; display: block; filter: drop-shadow(0 6px 14px rgba(4,21,15,0.25))">
    <h1 style="margin: 6px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">First<span style="color: #0E4D32">Touch</span></h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #56625B; text-align: center; max-width: 280px">Weekend morning soccer. Sign in to RSVP and see your team.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px; margin-top: {{gapTop}}">
    <button type="button" style="height: 56px; border-radius: 16px; border: 1.5px solid #D6D5CC; background: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; color: #121A15; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer">
      <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #D6D5CC; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #56625B">G</span>
      Continue with Google
    </button>
    <sc-if value="{{ emailOn }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 12px; color: #56625B; font-size: 14px; font-weight: 600">
        <div style="flex-grow: 1; height: 1px; background: #D6D5CC"></div>or<div style="flex-grow: 1; height: 1px; background: #D6D5CC"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="si-email" style="font-size: 14px; font-weight: 700">Email</label>
        <input id="si-email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 56px; border-radius: 16px; border: 1.5px solid #D6D5CC; background: #FFFFFF; padding: 0 16px; font-family: inherit; font-size: 17px; color: #121A15; box-sizing: border-box">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <label for="si-pass" style="font-size: 14px; font-weight: 700">Password</label>
          <a href="ForgotPassword.dc.html" style="font-size: 14px; font-weight: 700; text-decoration: none; min-height: 24px">Forgot password?</a>
        </div>
        <div style="position: relative">
          <input id="si-pass" type="{{passType}}" autocomplete="current-password" value="footy2027" style="width: 100%; height: 56px; border-radius: 16px; border: 1.5px solid #D6D5CC; background: #FFFFFF; padding: 0 56px 0 16px; font-family: inherit; font-size: 17px; color: #121A15; box-sizing: border-box">
          <button type="button" aria-label="{{eyeLabel}}" onClick="{{ toggleEye }}" style="position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border: none; background: transparent; color: #56625B; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle><path d="{{slash}}"></path></svg>
          </button>
        </div>
      </div>
      <button type="button" style="height: 56px; border-radius: 16px; border: none; background: #0E4D32; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Sign in</button>
    </sc-if>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <sc-if value="{{ emailOn }}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; font-size: 15px; color: #56625B">New here? <a href="CreateAccount.dc.html" style="font-weight: 700; text-decoration: none">Create an account</a></p>
    </sc-if>
    <p style="margin: 0; font-size: 13px; color: #56625B; text-align: center; line-height: 1.5">By continuing you agree to our <a href="#">Privacy policy</a>.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"emailAuth":{"editor":"enum","options":["off","on"],"default":"off"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: false };
  }
  renderVals() {
    const emailOn = (this.props.emailAuth ?? 'off') === 'on';
    return {
      emailOn,
      pad: emailOn ? '48px 24px 28px' : '120px 24px 32px',
      logo: emailOn ? '72px' : '112px',
      gapTop: emailOn ? '32px' : '64px',
      slash: this.state.show ? "" : "M3 3l18 18",
      passType: this.state.show ? 'text' : 'password',
      eyeLabel: this.state.show ? 'Hide password' : 'Show password',
      toggleEye: () => this.setState({ show: !this.state.show })
    };
  }
}
</script>
</body>
</html>
